# How the backend runs on Render, written down so production can be rebuilt from the repository.
#
# Read this before relying on it:
#  - Render applies a render.yaml only through a Blueprint. Merging this file does NOT change a
#    service that was created by hand in the dashboard. Treat it as the description to compare
#    the dashboard against, and as what a Blueprint would create.
#  - Secrets are never written here. `sync: false` makes Render ask for the value once, when the
#    Blueprint creates the service.
#  - `region` is left out on purpose: it cannot be changed after a service exists, so decide it
#    deliberately before the first apply (nearest to the UAE among Render's: frankfurt, singapore).
#  - Node version: .nvmrc / engines.node are used unless a NODE_VERSION variable is set in the
#    dashboard, which wins over both.
#  - Optional variables (defaults are fine) are listed at the bottom as comments.
services:
  - type: web
    name: trade-erp-nexus-nodejs
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # The server refuses to start in production without these two (JWT_SECRET: 32+ characters,
      # no placeholder).
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Warned about when missing. PLATFORM_JWT_SECRET must differ from JWT_SECRET. SECRET_BOX_KEY
      # is 64 hex characters; set it BEFORE people enrol in two-factor, or recovery codes break.
      - key: PLATFORM_JWT_SECRET
        sync: false
      - key: SECRET_BOX_KEY
        sync: false
      - key: PUBLIC_APP_URL
        value: https://zarvia.onrender.com
      # --- the app reaches this service through its OWN origin (see "Deployment (Render)" in CLAUDE.md) ---
      # The frontend sets VITE_API_URL=/api/v1 and rewrites /api/* here, so the backend's address is in no
      # request a client can see. Two consequences have to be configured, and ORDER MATTERS for both.
      #
      # The rewrite makes a fresh server-to-server request, so the visitor's address does not survive it and
      # every per-address limit would key on one egress. true switches the sign-in throttle off the address
      # and onto the email typed plus one overall ceiling (middleware/loginThrottle.js).
      # CHECK FIRST: GET /api/v1/health -> yourAddress. If that is the real visitor, set this to false and
      # nothing is lost. Tune with LOGIN_ACCOUNT_FAILURE_LIMIT (10) and LOGIN_GLOBAL_FAILURE_LIMIT (300).
      - key: SHARED_CLIENT_ADDRESS
        value: true
      # App and API are one origin now, so Lax is correct and is a stronger CSRF defence than the Origin
      # check it replaces. DO NOT set this before the frontend is actually on /api/v1: while the app still
      # calls this service cross-site, Lax stops the browser sending the session cookie and sign-in breaks.
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      # Pictures and logos
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Token lifetimes
      - key: JWT_EXPIRES_IN
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        sync: false
      # Optional: CORS_ORIGINS, TRUST_PROXY_HOPS, TRUST_CF_CONNECTING_IP, SUPPORT_CONTACT /
      # SUPPORT_EMAIL, TWO_FACTOR_ISSUER, SYSTEM_MAIL_PROVIDER (console | resend | smtp) with
      # SYSTEM_MAIL_FROM / _FROM_NAME / _REPLY_TO / _API_KEY / _SMTP_HOST|PORT|USER|PASS, and the
      # limits (LOGIN_FAILURE_LIMIT, FORGOT_PASSWORD_IP_LIMIT, JSON_BODY_LIMIT, ...).
      # Outbound SMTP is blocked on Render's free plan; use the resend provider there.
